<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура EXANTE Scenario Trainer</title>
  <desc id="desc">Схема React-клиента, FastAPI API, сервиса клиентского агента и супервайзера, SQLite и sqlite-vec памяти, OpenAI-совместимого LLM и необязательного Langfuse.</desc>
  <style>
    :root { color-scheme: light; }
    .bg { fill: #f7f9fc; }
    .title { font: 700 32px Inter, Arial, sans-serif; fill: #16233a; }
    .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #5c6b82; }
    .group { fill: #ffffff; stroke: #d7dfeb; stroke-width: 1.5; }
    .group-label { font: 700 14px Inter, Arial, sans-serif; fill: #6c7a90; letter-spacing: 1.2px; }
    .node { stroke-width: 1.5; }
    .node-title { font: 700 18px Inter, Arial, sans-serif; fill: #16233a; }
    .node-text { font: 400 14px Inter, Arial, sans-serif; fill: #40506a; }
    .node-code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #33415c; }
    .small { font: 400 12px Inter, Arial, sans-serif; fill: #58677e; }
    .edge { fill: none; stroke: #71809a; stroke-width: 2; marker-end: url(#arrow); }
    .edge-dashed { fill: none; stroke: #71809a; stroke-width: 1.75; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    .edge-label { font: 600 12px Inter, Arial, sans-serif; fill: #4e5d74; }
    .badge { font: 700 12px Inter, Arial, sans-serif; fill: #ffffff; }
  </style>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#253858" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#71809a"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1220"/>
  <text class="title" x="60" y="60">EXANTE Scenario Trainer — архитектура приложения</text>
  <text class="subtitle" x="60" y="89">React-интерфейс и FastAPI-сервис для тренировки Relationship Manager: клиент-агент, полный разбор супервайзера и семантическая память</text>

  <!-- React client -->
  <rect class="group" x="40" y="140" width="330" height="970" rx="20"/>
  <text class="group-label" x="66" y="176">ТОЧКИ ВХОДА</text>
  <rect x="68" y="210" width="274" height="316" rx="12" fill="#e9f2ff" stroke="#8bb8ff" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="92" y="248">React SPA</text>
  <text class="node-code" x="92" y="272">chat/src/* · Vite</text>
  <line x1="92" y1="292" x2="318" y2="292" stroke="#c3dafb"/>
  <text class="node-text" x="92" y="325">Список и история сценариев</text>
  <text class="node-text" x="92" y="350">Диалог RM с клиентом-агентом</text>
  <text class="node-text" x="92" y="375">Сигнал turn и отчёт супервайзера</text>
  <text class="node-code" x="92" y="416">useScenarios.js</text>
  <text class="small" x="92" y="442">VITE_API_BASE_URL → /api/v1</text>
  <text class="small" x="92" y="466">автоанализ, когда done = true</text>

  <rect x="68" y="620" width="274" height="222" rx="12" fill="#f5f7fb" stroke="#b8c5d9" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="92" y="658">Консольный чат</text>
  <text class="node-code" x="92" y="682">backend/cli.py</text>
  <line x1="92" y1="702" x2="318" y2="702" stroke="#d8e0eb"/>
  <text class="node-text" x="92" y="735">Локальный интерактивный процесс</text>
  <text class="node-text" x="92" y="760">/analyze · /reset · /quit</text>
  <text class="small" x="92" y="791">История только в памяти процесса</text>
  <text class="small" x="92" y="814">не использует FastAPI и SQLite</text>

  <!-- Backend boundary -->
  <rect class="group" x="405" y="140" width="905" height="970" rx="20"/>
  <text class="group-label" x="433" y="176">PYTHON / FASTAPI БЭКЕНД</text>

  <!-- Settings and prompts -->
  <rect x="440" y="210" width="325" height="126" rx="12" fill="#f1ebff" stroke="#bba4ff" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="464" y="247">Settings и lifespan</text>
  <text class="node-code" x="464" y="271">backend/settings.py · main.py</text>
  <text class="node-text" x="464" y="300">.env: LLM, SQLite, лимиты, CORS</text>
  <text class="small" x="464" y="322">создаёт Repository, AgentService, Langfuse</text>

  <rect x="820" y="210" width="450" height="126" rx="12" fill="#fff6df" stroke="#efbb54" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="844" y="247">Правила и контракты ролей</text>
  <text class="node-code" x="844" y="271">agent/customer.md · supervisor.md</text>
  <text class="node-code" x="844" y="294">app/supervisor_contract.py</text>
  <text class="small" x="844" y="320">персона клиента, коучинг, русскоязычный валидируемый отчёт</text>

  <!-- API -->
  <rect x="440" y="390" width="325" height="350" rx="12" fill="#e8fbf5" stroke="#67c9a7" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="464" y="428">FastAPI application</text>
  <text class="node-code" x="464" y="452">main.py · app/api.py</text>
  <line x1="464" y1="472" x2="741" y2="472" stroke="#b4dfd0"/>
  <text class="node-text" x="464" y="505">POST /scenarios/turns</text>
  <text class="node-text" x="464" y="530">POST /scenarios/{id}/analysis</text>
  <text class="node-text" x="464" y="558">GET список, сценарий, сообщения</text>
  <text class="node-text" x="464" y="584">DELETE /scenarios/{id}</text>
  <text class="small" x="464" y="620">Pydantic request/response schemas</text>
  <text class="small" x="464" y="644">404 / 422 через сценарные ошибки</text>
  <text class="small" x="464" y="690">GET/DELETE читают Repository напрямую</text>

  <!-- Orchestrator -->
  <rect x="820" y="390" width="450" height="350" rx="12" fill="#eaf0ff" stroke="#89aaff" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="844" y="428">AgentService</text>
  <text class="node-code" x="844" y="452">app/agent_service.py · LangChain</text>
  <line x1="844" y1="472" x2="1246" y2="472" stroke="#bdcfff"/>
  <text class="node-title" x="844" y="507">1. Клиент-агент: обработка turn</text>
  <text class="node-text" x="844" y="533">prompt + history + semantic context</text>
  <text class="node-text" x="844" y="558">→ AgentResponseData: reply, state, trust,</text>
  <text class="node-text" x="862" y="579">probability, done и внутренний intetions</text>
  <text class="node-title" x="844" y="620">2. Супервайзер: анализ сценария</text>
  <text class="node-text" x="844" y="646">вся видимая история → SupervisorAnalysisData</text>
  <text class="small" x="844" y="690">проверяет порядок каждой реплики и язык отчёта;</text>
  <text class="small" x="844" y="710">при невалидном отчёте повторяет запрос один раз</text>

  <!-- Memory and embeddings -->
  <rect x="440" y="830" width="325" height="220" rx="12" fill="#eef9e9" stroke="#88c971" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="464" y="868">История LangChain</text>
  <text class="node-code" x="464" y="892">app/memory.py</text>
  <text class="node-text" x="464" y="922">SQLiteScenarioMessageHistory</text>
  <text class="node-text" x="464" y="947">читает последние N сообщений</text>
  <text class="node-text" x="464" y="972">сохраняет RM + JSON клиента</text>
  <text class="small" x="464" y="1008">наружу и в контекст — только reply клиента</text>

  <rect x="820" y="830" width="225" height="220" rx="12" fill="#fff0f1" stroke="#ed9399" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="844" y="868">Embeddings</text>
  <text class="node-code" x="844" y="892">app/embeddings.py</text>
  <text class="node-text" x="844" y="922">LocalHashEmbeddings</text>
  <text class="node-text" x="844" y="947">локальные,</text>
  <text class="node-text" x="844" y="968">детерминированные</text>
  <text class="small" x="844" y="1008">без embedding API</text>

  <!-- External services -->
  <rect class="group" x="1345" y="140" width="415" height="500" rx="20"/>
  <text class="group-label" x="1373" y="176">ВНЕШНИЕ СЕРВИСЫ</text>
  <rect x="1375" y="210" width="355" height="220" rx="12" fill="#fff1e6" stroke="#f3a567" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="1399" y="248">OpenAI-совместимый LLM</text>
  <text class="node-code" x="1399" y="272">app/providers.py · ChatOpenAI</text>
  <line x1="1399" y1="292" x2="1706" y2="292" stroke="#f5ca9d"/>
  <text class="node-text" x="1399" y="325">Ollama · OpenRouter · OpenAI</text>
  <text class="node-text" x="1399" y="350">или иной compatible endpoint</text>
  <text class="small" x="1399" y="384">structured output для двух цепочек:</text>
  <text class="small" x="1399" y="405">customer response / supervisor report</text>

  <rect x="1375" y="485" width="355" height="124" rx="12" fill="#f2edff" stroke="#ac9be8" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="1399" y="523">Langfuse (опционально)</text>
  <text class="node-code" x="1399" y="547">app/observability.py</text>
  <text class="node-text" x="1399" y="574">trace = turn · session = scenario</text>
  <text class="small" x="1399" y="595">PII / credentials masking перед экспортом</text>

  <!-- Local persistence -->
  <rect class="group" x="1345" y="700" width="415" height="410" rx="20"/>
  <text class="group-label" x="1373" y="736">ЛОКАЛЬНОЕ ХРАНИЛИЩЕ</text>
  <rect x="1375" y="770" width="355" height="280" rx="12" fill="#eef5ff" stroke="#7da9e8" class="node" filter="url(#shadow)"/>
  <text class="node-title" x="1399" y="808">ChatRepository</text>
  <text class="node-code" x="1399" y="832">app/storage.py · SQLite</text>
  <line x1="1399" y1="852" x2="1706" y2="852" stroke="#bcd4f3"/>
  <text class="node-text" x="1399" y="885">chats · messages · metadata_json</text>
  <text class="node-text" x="1399" y="915">WAL + внешние ключи</text>
  <text class="node-text" x="1399" y="950">sqlite_vec (режим sqlite_vec)</text>
  <text class="small" x="1399" y="974">message_vectors + similarity search</text>
  <text class="small" x="1399" y="1015">sqlite: только обычная история</text>

  <!-- Main flows -->
  <path class="edge" d="M342 430 H440"/>
  <circle cx="391" cy="430" r="12" fill="#477ee8"/><text class="badge" x="387.5" y="434.5">1</text>
  <text class="edge-label" x="362" y="410">HTTP / JSON</text>

  <path class="edge-dashed" d="M602 336 V390"/>
  <text class="edge-label" x="615" y="367">config</text>

  <path class="edge" d="M765 555 H820"/>
  <circle cx="793" cy="555" r="12" fill="#477ee8"/><text class="badge" x="789.5" y="559.5">2</text>
  <text class="edge-label" x="773" y="535">turn / analysis</text>

  <path class="edge-dashed" d="M1045 336 V390"/>
  <text class="edge-label" x="1058" y="368">prompts + contract</text>

  <path class="edge" d="M940 740 V830"/>
  <circle cx="940" cy="785" r="12" fill="#477ee8"/><text class="badge" x="936.5" y="789.5">3</text>
  <text class="edge-label" x="954" y="788">embed query / index</text>

  <path class="edge" d="M820 688 C790 720, 722 748, 682 830"/>
  <circle cx="753" cy="750" r="12" fill="#477ee8"/><text class="badge" x="749.5" y="754.5">4</text>
  <text class="edge-label" x="596" y="772">history window + save turn</text>

  <path class="edge" d="M1270 530 C1320 530, 1325 370, 1375 370"/>
  <circle cx="1325" cy="483" r="12" fill="#477ee8"/><text class="badge" x="1321.5" y="487.5">5</text>
  <text class="edge-label" x="1282" y="446">две structured chains</text>

  <path class="edge-dashed" d="M1270 648 C1320 648, 1325 548, 1375 548"/>
  <text class="edge-label" x="1280" y="621">trace / retriever / generation</text>

  <path class="edge" d="M1045 940 H1375"/>
  <text class="edge-label" x="1080" y="921">semantic search · message vectors</text>

  <path class="edge" d="M765 1025 V1080 H1320 V900 H1375"/>
  <text class="edge-label" x="1050" y="1102">read / persist messages</text>

  <path class="edge-dashed" d="M1270 705 H1320 V790 H1375"/>
  <text class="edge-label" x="1110" y="726">full history for supervisor</text>

  <path class="edge-dashed" d="M342 730 H390 V1080 H1330 V340 H1375"/>
  <text class="edge-label" x="548" y="1102">CLI: direct LLM call (без API и SQLite)</text>

  <path class="edge-dashed" d="M440 680 H402 V490 H342"/>
  <text class="edge-label" x="77" y="560">ScenarioTurnResponse</text>

  <!-- Footer -->
  <line x1="60" y1="1154" x2="1740" y2="1154" stroke="#d7dfeb"/>
  <text class="small" x="60" y="1180">Основной путь turn: UI → API → AgentService → память и LLM → SQLite → структурированный JSON. Анализ использует всю сохранённую видимую историю.</text>
  <text class="small" x="1740" y="1180" text-anchor="end">Пунктир: конфигурация, наблюдаемость и альтернативный CLI-путь.</text>
</svg>
